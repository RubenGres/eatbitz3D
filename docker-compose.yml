services:
  gateway:
    container_name: eatbitz_gateway
    image: nginx:alpine
    depends_on:
      - eatbitz3d
      - rembg
      - venn_static
    ports:
      - "${EATBITZ_GATEWAY_PORT:-8888}:80"
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - default
      - web                  # <-- added

  eatbitz3d:
    container_name: eatbitz_three_web
    build:
      context: ./three
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: always

  rembg:
    container_name: bitz_rembg_service
    build:
      context: ./remove_bg_pipeline
      dockerfile: Dockerfile
    environment:
      - BITZ_CACHE_DIR=${BITZ_CACHE_DIR:-/opt/EATBITZ/rembg}
    expose:
      - "8787"
    volumes:
      - ${BITZ_CACHE_DIR:-/opt/EATBITZ/rembg}:/opt/EATBITZ/rembg
    restart: always

  venn_static:
    container_name: venn_static_server
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ${VENN_STATIC_DIR:-./server}:/usr/share/nginx/html:ro
      - ./venn_static.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

networks:
  default:                   # <-- the existing eatbitz3d_default network
  web:
    external: true           # <-- references the web network from reverse-proxy