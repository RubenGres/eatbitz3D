server {
    listen 80;
    server_name localhost;

    # Required headers for Godot web exports
    add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    add_header Cross-Origin-Opener-Policy 'same-origin' always;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/wasm
        application/javascript
        application/octet-stream
        text/html
        text/css;

    # ── HTML: never cache (so deployments are picked up immediately) ──────
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cache-Control 'no-cache';

        types {
            text/html html;
        }
    }

    # ── Heavy assets: long cache + gzip ───────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        # Cache .wasm, .pck, .js for 7 days (they change only on redeploy)
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cache-Control 'public, max-age=604800';

        types {
            application/wasm wasm;
            text/html html;
            application/javascript js;
            text/css css;
            application/octet-stream pck;
        }
    }
}
