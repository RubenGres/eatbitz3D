server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=30s;

    # ── Gzip at the gateway level ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/wasm
        application/javascript
        application/octet-stream
        text/html
        text/css
        application/json
        video/mp4;

    location = / {
        return 302 /venn/;
    }

    location = /venn {
        return 301 /venn/;
    }
    location /venn/ {
        set $upstream_eatbitz3d eatbitz3d;
        rewrite ^/venn/(.*) /$1 break;
        proxy_pass http://$upstream_eatbitz3d;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /venn/video {
        return 301 /venn/video/;
    }
    location ^~ /venn/video/ {
        set $upstream_venn venn_static;
        rewrite ^/venn/video/(.*) /$1 break;
        proxy_pass http://$upstream_venn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rembg {
        return 301 /rembg/;
    }
    location /rembg/ {
        set $upstream_rembg rembg;
        proxy_pass http://$upstream_rembg:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
