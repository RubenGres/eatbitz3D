server {
  listen 80;
  server_name localhost;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    application/javascript
    text/javascript
    text/css
    text/html
    application/json
    image/svg+xml
    model/obj
    text/plain;

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control 'no-cache';
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control 'public, max-age=604800';

    types {
      text/html                   html;
      application/javascript      js mjs;
      text/css                    css;
      application/json            json;
      image/svg+xml               svg;
      image/png                   png;
      image/jpeg                  jpg jpeg;
      model/obj                   obj;
      text/plain                  mtl;
      font/ttf                    ttf;
      font/otf                    otf;
    }
  }
}
